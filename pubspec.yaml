name: multi_window_sample
description: "Flutter Desktop multi-window sample: one process, one engine per window."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # pub.dev 0.3.1 사본. Windows 서브 엔진을 Skia로 고정하는 패치가 들어 있다 (README "체크 포인트" 참고).
  desktop_multi_window:
    path: packages/desktop_multi_window
  # window_manager가 이미 쓰는 패키지. 메인 창이 있는 모니터의 작업 영역을 찾는 데 쓴다.
  screen_retriever: ^0.2.2
  # pub.dev 0.5.2는 macOS에서 닫힌 서브 창의 엔진을 해제하지 못한다 (README "체크 포인트" 참고).
  # desktop_multi_window README가 권하는 포크를 고정 커밋으로 쓴다.
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
