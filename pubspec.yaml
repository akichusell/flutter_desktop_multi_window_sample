name: multi_window_sample
description: "Flutter Desktop multi-window sample: one process, one engine per window."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  desktop_multi_window: 0.3.1
  # pub.dev 0.5.2는 macOS에서 닫힌 서브 창의 엔진을 해제하지 못한다 (README "알아 두면 좋은 함정" 참고).
  # desktop_multi_window README가 권하는 포크를 고정 커밋으로 쓴다.
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
